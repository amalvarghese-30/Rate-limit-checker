version: '3.8'

services:
  rate-limit-checker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rate-limit-checker
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - ALLOW_LOCAL_TARGETS=false
      - MAX_CONCURRENT_JOBS=5
      # - API_KEY=your_secure_api_key_here
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
